<!DOCTYPE html>
<html>
<head>
    <title>CSS Margin and Padding</title>

    <style>

        /* =========================
           MARGIN
           ========================= */

        .margin-box {

            /* All 4 sides */
            margin: 20px;

            /* Individual sides */
            margin-top: 10px;
            margin-right: 20px;
            margin-bottom: 30px;
            margin-left: 40px;

            background-color: lightblue;
        }


        /* =========================
           PADDING
           ========================= */

        .padding-box {

            /* All 4 sides */
            padding: 20px;

            /* Individual sides */
            padding-top: 10px;
            padding-right: 20px;
            padding-bottom: 30px;
            padding-left: 40px;

            background-color: lightgreen;
        }


        /* =========================
           SHORTHAND
           ========================= */

        .short-box {

            /* top right bottom left */
            margin: 10px 20px 30px 40px;

            padding: 10px 20px 30px 40px;

            background-color: lightyellow;
        }

    </style>
</head>

<body>

    <div class="margin-box">
        Margin Example
    </div>

    <div class="padding-box">
        Padding Example
    </div>

    <div class="short-box">
        Shorthand Example
    </div>

</body>
</html>

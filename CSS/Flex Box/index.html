<!DOCTYPE html>
<html>
<head>
    <title>CSS Flexbox</title>

    <style>

        /* =========================
           FLEX CONTAINER
           ========================= */

        .container {
            display: flex;

            /* Main Axis */
            flex-direction: row;

            /* Horizontal alignment */
            justify-content: space-around;

            /* Vertical alignment */
            align-items: center;

            /* Space between rows */
            gap: 10px;

            /* Allow items to move to next line */
            flex-wrap: wrap;

            width: 600px;
            height: 300px;

            background-color: lightgray;
        }


        /* =========================
           FLEX ITEMS
           ========================= */

        .box {
            width: 100px;
            height: 100px;

            background-color: lightblue;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           FLEX ITEM PROPERTIES
           ========================= */

        .box1 {
            order: 2;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            flex-grow: 1;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box box1">Box 1</div>

        <div class="box box2">Box 2</div>

        <div class="box box3">Box 3</div>

    </div>

</body>
</html>

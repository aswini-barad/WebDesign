<!DOCTYPE html>
<html>
<head>
    <title>CSS Text Properties</title>

    <style>

        /* =========================
           CSS TEXT PROPERTIES
           ========================= */

        .text {

            /* 1. Text Color */
            color: blue;

            /* 2. Text Alignment */
            text-align: center;

            /* 3. Text Direction */
            direction: ltr;

            /* 4. Text Decoration */
            text-decoration: underline;

            /* 5. Text Transformation */
            text-transform: uppercase;

            /* 6. Text Indentation */
            text-indent: 50px;

            /* 7. Letter Spacing */
            letter-spacing: 3px;

            /* 8. Word Spacing */
            word-spacing: 10px;

            /* 9. Line Height */
            line-height: 2;

            /* 10. Text Shadow */
            text-shadow: 2px 2px 3px gray;

            /* 11. White Space */
            white-space: normal;

            /* 12. Text Overflow */
            text-overflow: ellipsis;

        }

    </style>
</head>

<body>

    <p class="text">
        This is an example paragraph to understand CSS text properties.
    </p>

</body>
</html>

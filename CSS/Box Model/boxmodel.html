<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>

        /* =========================
           CSS BOX MODEL
           ========================= */

        .box {

            /* 1. Content */
            width: 300px;
            height: 150px;

            /* 2. Padding
               Space between content and border */
            padding: 20px;

            /* 3. Border */
            border: 5px solid black;

            /* 4. Margin
               Space outside the border */
            margin: 30px;

            /* Extra */
            background-color: lightblue;
        }

    </style>
</head>

<body>

    <div class="box">
        CSS Box Model
    </div>

</body>
</html>

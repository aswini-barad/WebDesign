<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body>

<h2>Student Registration Form</h2>

<form action="result.jsp" method="post">

    <fieldset>

        <legend>Personal Information</legend>

        <label for="name">Name:</label>
        <input type="text"
               id="name"
               name="name"
               placeholder="Enter your name"
               required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="email"
               required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password"
               id="password"
               name="password"
               minlength="6"
               required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number"
               id="age"
               name="age"
               min="18"
               max="60">
        <br><br>

        Gender:

        <input type="radio"
               id="male"
               name="gender"
               value="Male">

        <label for="male">Male</label>

        <input type="radio"
               id="female"
               name="gender"
               value="Female">

        <label for="female">Female</label>

        <br><br>

        Courses:

        <input type="checkbox"
               name="course"
               value="Java">
        Java

        <input type="checkbox"
               name="course"
               value="Python">
        Python

        <input type="checkbox"
               name="course"
               value="HTML">
        HTML

        <br><br>

        <label for="country">Country:</label>

        <select id="country" name="country">

            <option value="">--Select--</option>

            <option value="india" selected>
                India
            </option>

            <option value="usa">
                USA
            </option>

            <option value="uk">
                UK
            </option>

        </select>

        <br><br>

        <label for="address">Address:</label><br>

        <textarea id="address"
                  name="address"
                  rows="4"
                  cols="30"
                  placeholder="Enter your address">
        </textarea>

        <br><br>

        <label for="photo">Upload Photo:</label>

        <input type="file"
               id="photo"
               name="photo">

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Clear">

    </fieldset>

</form>

</body>
</html>

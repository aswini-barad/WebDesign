```html
<!DOCTYPE html>
<html>

<head>
    <title>Complete HTML Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <!-- FORM TAG -->
    <form action="result.jsp" method="post">

        <!-- FIELDSET + LEGEND -->
        <fieldset>

            <legend>Personal Information</legend>

            <!-- TEXT -->
            <label for="name">Name:</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your name"
                   required>
            <br><br>


            <!-- PASSWORD -->
            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   minlength="6"
                   required>
            <br><br>


            <!-- EMAIL -->
            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="abc@gmail.com">
            <br><br>


            <!-- NUMBER -->
            <label for="age">Age:</label>
            <input type="number"
                   id="age"
                   name="age"
                   min="18"
                   max="60">
            <br><br>


            <!-- TELEPHONE -->
            <label for="phone">Phone:</label>
            <input type="tel"
                   id="phone"
                   name="phone">
            <br><br>


            <!-- URL -->
            <label for="website">Website:</label>
            <input type="url"
                   id="website"
                   name="website">
            <br><br>


            <!-- DATE -->
            <label for="dob">Date of Birth:</label>
            <input type="date"
                   id="dob"
                   name="dob">
            <br><br>


            <!-- TIME -->
            <label for="time">Preferred Time:</label>
            <input type="time"
                   id="time"
                   name="time">
            <br><br>


            <!-- COLOR -->
            <label for="color">Favorite Color:</label>
            <input type="color"
                   id="color"
                   name="color">
            <br><br>


            <!-- RANGE -->
            <label for="range">Skill Level:</label>
            <input type="range"
                   id="range"
                   name="skill"
                   min="0"
                   max="100"
                   value="50">
            <br><br>


            <!-- RADIO BUTTON -->
            Gender:

            <input type="radio"
                   id="male"
                   name="gender"
                   value="Male">

            <label for="male">Male</label>

            <input type="radio"
                   id="female"
                   name="gender"
                   value="Female">

            <label for="female">Female</label>

            <br><br>


            <!-- CHECKBOX -->
            Courses:

            <input type="checkbox"
                   id="java"
                   name="course"
                   value="Java">

            <label for="java">Java</label>


            <input type="checkbox"
                   id="python"
                   name="course"
                   value="Python">

            <label for="python">Python</label>


            <input type="checkbox"
                   id="html"
                   name="course"
                   value="HTML">

            <label for="html">HTML</label>

            <br><br>


            <!-- SELECT + OPTION + OPTGROUP -->
            <label for="country">Country:</label>

            <select id="country" name="country">

                <option value="">-- Select Country --</option>

                <optgroup label="Asia">

                    <option value="india" selected>
                        India
                    </option>

                    <option value="japan">
                        Japan
                    </option>

                </optgroup>

                <optgroup label="Europe">

                    <option value="uk">
                        United Kingdom
                    </option>

                    <option value="france">
                        France
                    </option>

                </optgroup>

            </select>

            <br><br>


            <!-- TEXTAREA -->
            <label for="address">Address:</label>
            <br>

            <textarea id="address"
                      name="address"
                      rows="4"
                      cols="30"
                      placeholder="Enter your address">
            </textarea>

            <br><br>


            <!-- DATALIST -->
            <label for="browser">Choose Browser:</label>

            <input list="browsers"
                   id="browser"
                   name="browser">

            <datalist id="browsers">

                <option value="Google Chrome">
                <option value="Mozilla Firefox">
                <option value="Microsoft Edge">
                <option value="Safari">

            </datalist>

            <br><br>


            <!-- FILE -->
            <label for="photo">Upload Photo:</label>

            <input type="file"
                   id="photo"
                   name="photo">

            <br><br>


            <!-- HIDDEN -->
            <input type="hidden"
                   name="studentId"
                   value="101">


            <!-- OUTPUT -->
            <label>Result:</label>

            <output name="result">
                100
            </output>

            <br><br>


            <!-- PROGRESS -->
            <label>Course Progress:</label>

            <progress value="70" max="100">
                70%
            </progress>

            <br><br>


            <!-- METER -->
            <label>Skill Level:</label>

            <meter value="7"
                   min="0"
                   max="10">
                7 out of 10
            </meter>

            <br><br>


            <!-- SUBMIT BUTTON -->
            <input type="submit"
                   value="Register">


            <!-- RESET BUTTON -->
            <input type="reset"
                   value="Clear">


            <!-- INPUT BUTTON -->
            <input type="button"
                   value="Normal Button">


            <!-- BUTTON TAG -->
            <button type="submit">
                Submit Using Button Tag
            </button>

        </fieldset>

    </form>

</body>

</html>
```

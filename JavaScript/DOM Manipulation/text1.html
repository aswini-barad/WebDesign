<!DOCTYPE html>
<html>
<body>

    <p id="text">JavaScript is easy!</p>

    <button onclick="changeStyle()">Change Style</button>

    <script>
        function changeStyle() {
            let x = document.getElementById("text");

            x.style.color = "red";
            x.style.fontSize = "25px";
            x.style.fontWeight = "bold";
        }
    </script>

</body>
</html>

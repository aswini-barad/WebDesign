<!DOCTYPE html>
<html>
<body>

    <input type="text" id="name" value="Aswini">

    <button onclick="showName()">Click</button>

    <p id="result"></p>

    <script>
        function showName() {
            let name = document.getElementById("name").value;

            document.getElementById("result").innerHTML = name;
        }
    </script>

</body>
</html>

<html>
	<body>
		<script>
			
			var num1=parseInt(prompt("Enter First number"));
			var num2=parseInt(prompt("Enter Second number"));
			var choice=parseInt(prompt("Enter a choice(1-Add,2-Substraction,3-Multiply"));

			switch(choice){
			case 1:
				alert("Sum ="+(num1+num2));
				break;
			case 2:
				alert("Substraction ="+(num1-num2));
				break;	
			case 3:
				alert("Multiplication ="+(num1*num2));
				break;	
			default:
				alert("Invalid choice");
					
			}

		</script>
	</body>
</html>

<html>
	<body>
		<script>
			
			var num=parseInt(prompt("Enter a number to check number of digit"));
			if(num<0){
				num = -num;
			}
			
			if(num <10){
				alert(num +" is a Single Digit");
			}
			else if(num<100){
				alert("Double digit");
			}else{
				alert("More than two digits");
			}

		</script>
	</body>
</html>

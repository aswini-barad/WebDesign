<html>
    <body>

        <form>
            Principal:
            <input type="text" id="p"><br>

            Interest Rate:
            <input type="text" id="r"><br>

            Time:
            <input type="text" id="t"><br>

            <input type="button" value="Calculate" onclick="siCalc()">
        </form>

        <p id="result"></p>

        <script>

            function siCalc() {

                var p = document.getElementById("p").value;
                var r = document.getElementById("r").value;
                var t = document.getElementById("t").value;

                var si = (p * r * t) / 100;

                document.getElementById("result").innerHTML =
                    "Simple Interest = " + si;
            }

        </script>

    </body>
</html>

<html>
    <body>

        <form>
            Principal:
            <input type="text" id="p"><br>

            Interest Rate:
            <input type="text" id="r"><br>

            Time:
            <input type="text" id="t"><br>

            <input type="button" value="Calculate" onclick="siCalc()">

            Result:
            <input type="text" id="result">
        </form>


        <script>

            function siCalc() {

                var p = document.getElementById("p").value;
                var r = document.getElementById("r").value;
                var t = document.getElementById("t").value;

                var si = (p * r * t) / 100;

                document.getElementById("result").value = si;
            }

        </script>

    </body>
</html>

<html>
    <body>
        <script>

        	var p=parseInt(prompt("Enter principal amount"));
			var t=parseInt(prompt("Enter Time"));
			var r=parseInt(prompt("Enter Rate of Interest"));

        	function si(p,t,r){
        		si = (p*t*r)/100;
        		return si;
        	}

        	si =si(p,t,r);
        	document.write("Simple Interst is ="+si);

        </script>
    </body>
</html>

<html>
    <body>
        <script>

            var i = 65;
            var j = 65;

            for(i = 65; i <= 67; i++) {

                for(j = 65; j <= 68; j++) {

                    document.write(String.fromCharCode(j) + "&nbsp;&nbsp;&nbsp;&nbsp;");

                }

                document.write("<br>");
            }

        </script>
    </body>
</html>
